<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
<title>GRABIT</title>
<style>
  :root { color-scheme: light dark; }
  * { box-sizing: border-box; }
  html, body {
    margin: 0; padding: 0; height: 100%;
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    background: #0b0b0f; color: #f5f5f7;
    display: flex; align-items: center; justify-content: center;
  }
  .wrap {
    max-width: 360px; width: 100%; padding: 32px 24px;
    text-align: center;
  }
  .brand {
    font-size: 22px; font-weight: 800; letter-spacing: -0.02em;
    color: #ff6b35; margin-bottom: 28px;
  }
  .icon { font-size: 44px; margin-bottom: 16px; }
  h1 { font-size: 19px; font-weight: 700; margin: 0 0 8px; }
  p { font-size: 14px; line-height: 1.5; color: #b8b8bf; margin: 0 0 24px; }
  button {
    appearance: none; border: none; border-radius: 999px;
    background: #ff6b35; color: #fff; font-size: 15px; font-weight: 700;
    padding: 13px 28px; width: 100%; cursor: pointer;
  }
  button:active { opacity: 0.85; }
</style>
</head>
<body>
  <div class="wrap">
    <div class="brand">GRABIT</div>
    <div class="icon" id="icon">📡</div>
    <h1 id="title">You're offline</h1>
    <p id="message">Please check your internet connection and try again.</p>
    <button id="retry">Retry</button>
  </div>
  <script>
    (function () {
      var params = new URLSearchParams(window.location.search);
      var reason = params.get("reason") || "network";
      var target = params.get("target") || "";

      if (reason === "server") {
        document.getElementById("icon").textContent = "🛠️";
        document.getElementById("title").textContent = "GRABIT is temporarily unavailable";
        document.getElementById("message").textContent =
          "Our servers are having trouble right now. Please try again in a moment.";
      }

      document.getElementById("retry").addEventListener("click", function () {
        if (target) {
          window.location.href = target;
        } else {
          window.location.reload();
        }
      });
    })();
  </script>
</body>
</html>
